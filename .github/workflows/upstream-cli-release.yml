name: Validate upstream CLI release

on:
  repository_dispatch:
    types: [mermail-cli-compatible, mermail-cli-released]
  workflow_dispatch:
    inputs:
      cli_version:
        description: Released or validated CLI semver
        required: true
      source_sha:
        description: Source commit SHA from Nudgen-Marketing/mermail-cli
        required: true
      mcp_version:
        description: Optional originating MCP semver
        required: false
      source_run_url:
        description: Optional upstream workflow URL
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-cli-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CLI_VERSION: ${{ github.event.client_payload.cli_version || inputs.cli_version }}
      MCP_VERSION: ${{ github.event.client_payload.mcp_version || inputs.mcp_version }}
      SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository || 'Nudgen-Marketing/mermail-cli' }}
      SOURCE_SHA: ${{ github.event.client_payload.source_sha || inputs.source_sha }}
      SOURCE_RUN_URL: ${{ github.event.client_payload.source_run_url || inputs.source_run_url }}
      UPSTREAM_TRIGGER: ${{ github.event.client_payload.trigger || 'manual' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Validate dispatch payload
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [[ "$CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid CLI semver: $CLI_VERSION" >&2
            exit 1
          }
          if [[ -n "$MCP_VERSION" ]]; then
            [[ "$MCP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || {
              echo "Invalid MCP semver: $MCP_VERSION" >&2
              exit 1
            }
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid source SHA" >&2; exit 1; }
          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            [[ "$SOURCE_REPOSITORY" == "Nudgen-Marketing/mermail-cli" ]] || { echo "Unexpected source repository" >&2; exit 1; }
            [[ "$SOURCE_RUN_URL" =~ ^https://github\.com/Nudgen-Marketing/mermail-cli/actions/runs/[0-9]+$ ]] || {
              echo "Invalid source workflow URL" >&2
              exit 1
            }
          fi

      - run: npm ci

      - name: Validate skills against the live MCP contract
        id: contract
        continue-on-error: true
        env:
          MERMAIL_MCP_TEST_API_KEY: ${{ secrets.MERMAIL_MCP_TEST_API_KEY }}
        run: |
          set -euo pipefail
          npm test
          npm run release:check
          npm run validate:remote

      - name: Open or update skills synchronization issue
        if: steps.contract.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MCP_LABEL="${MCP_VERSION:-current}"
          TITLE="[automation] CLI v${CLI_VERSION} / MCP ${MCP_LABEL} requires skills synchronization"
          NUMBER="$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n 1)"
          BODY="$RUNNER_TEMP/upstream-cli-release.md"
          {
            echo "The upstream release did not pass the Mermail skills compatibility gate."
            echo
            echo "- CLI version: \`${CLI_VERSION}\`"
            if [[ -n "$MCP_VERSION" ]]; then echo "- MCP version: \`${MCP_VERSION}\`"; fi
            echo "- Trigger: \`${UPSTREAM_TRIGGER}\`"
            echo "- Source repository: \`${SOURCE_REPOSITORY}\`"
            echo "- Source commit: \`${SOURCE_SHA}\`"
            if [[ -n "$SOURCE_RUN_URL" ]]; then echo "- Upstream workflow: ${SOURCE_RUN_URL}"; fi
            echo "- Receiver workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Update tool coverage, compatibility metadata, skill instructions, and scenarios as required; bump all plugin manifests together before merging the release."
          } > "$BODY"
          if [[ -n "$NUMBER" ]]; then
            gh issue edit "$NUMBER" --body-file "$BODY"
          else
            gh issue create --title "$TITLE" --body-file "$BODY"
          fi

      - name: Close resolved skills synchronization issue
        if: steps.contract.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MCP_LABEL="${MCP_VERSION:-current}"
          TITLE="[automation] CLI v${CLI_VERSION} / MCP ${MCP_LABEL} requires skills synchronization"
          NUMBER="$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n 1)"
          if [[ -n "$NUMBER" ]]; then
            gh issue close "$NUMBER" --comment "The current skills package passes the upstream compatibility gate."
          fi

      - name: Stop when skills synchronization is required
        if: steps.contract.outcome != 'success'
        run: exit 1

      - name: Record successful orchestration summary
        run: |
          SKILLS_VERSION="$(node -p "require('./package.json').version")"
          {
            echo "## Cross-repository release chain complete"
            echo
            echo "- CLI: \`v${CLI_VERSION}\`"
            if [[ -n "$MCP_VERSION" ]]; then echo "- MCP: \`v${MCP_VERSION}\`"; fi
            echo "- Skills: \`v${SKILLS_VERSION}\`"
            echo "- Trigger: \`${UPSTREAM_TRIGGER}\`"
          } >> "$GITHUB_STEP_SUMMARY"
