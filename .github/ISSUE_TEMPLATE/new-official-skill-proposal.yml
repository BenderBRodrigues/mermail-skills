name: New official skill proposal
description: Propose a new curated skill inside Nudgen-Marketing/mermail-skills
title: "[official-skill] "
labels: ["official-skill"]
body:
  - type: markdown
    attributes:
      value: |
        Only use this when the skill maps to Mermail MCP tools and should ship in the official package.
        For niche Mermail + other-app workflows, use the **Community companion idea** template instead.
  - type: input
    id: proposed_name
    attributes:
      label: Proposed skill directory / name
      placeholder: mermail-example-workflow
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: When should agents load this skill?
    validations:
      required: true
  - type: textarea
    id: tools
    attributes:
      label: MCP tools owned by this skill
      description: Must not duplicate ownership already in tool-coverage.json
    validations:
      required: true
  - type: textarea
    id: why_official
    attributes:
      label: Why this belongs in the official package (not a companion)
    validations:
      required: true
  - type: checkboxes
    id: readiness
    attributes:
      label: Contributor readiness
      options:
        - label: I can update tool-coverage.json, routing.md, scenarios, README, and agents/openai.yaml in one PR
          required: true
        - label: I have read AUTHORING.md and SECURITY.md
          required: true
