interface:
  display_name: "Mermail Scheduling Agent"
  short_description: "Book meetings from email with Google Calendar and Mermail"
  default_prompt: "Use $mermail-scheduling-agent when the job is scheduling, checking calendar availability, offering slots, or confirming a meeting through Mermail."
dependencies:
  tools:
    - type: "mcp"
      value: "mermail"
      description: "Mermail workspace and mailbox MCP server"
      transport: "streamable_http"
      url: "https://console.mermail.app/mcp"
