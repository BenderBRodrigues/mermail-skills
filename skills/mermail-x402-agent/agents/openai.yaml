  short_description: "Pay x402 with Agent Wallet, then continue the task"
  default_prompt: "Use $mermail-x402-agent when the job is to discover an x402 service, charge required_charge = max(live quote, vendor prepaid floor) within the user maximum spend, pay once with Agent Wallet, and continue the original task with the paid result."
dependencies:
  tools:
    - type: "mcp"
      value: "mermail"
      description: "Mermail workspace and mailbox MCP server"
      transport: "streamable_http"
      url: "https://console.mermail.app/mcp"
